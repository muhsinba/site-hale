name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Lint, typecheck, unit + API tests, and a production build. No DB needed for these
  # (the chart engine/route are DB-free); a dummy DATABASE_URL keeps Prisma's client
  # constructor happy during build.
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:${{ github.workspace }}/ci.db
      RESEND_API_KEY: dummy
      GROQ_API_KEY: dummy
      ADMIN_PASSWORD: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build

  # End-to-end browser tests against a production build. Needs a seeded SQLite DB so the
  # homepage (services) renders.
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:${{ github.workspace }}/ci.db
      RESEND_API_KEY: dummy
      GROQ_API_KEY: dummy
      ADMIN_PASSWORD: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
